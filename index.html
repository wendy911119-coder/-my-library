<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我的藏書室</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500&family=Noto+Serif+TC:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f2ee;--card:#fbfaf8;--ink:#3b3028;--mute:#8d8174;--line:#e4ded3;--accent:#8a5a35;--accent2:#b98552;--chip:#ece6da;--sh:0 8px 26px -12px rgba(80,55,30,.3);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171513;--card:#211e1b;--ink:#efe7db;--mute:#9a9082;--line:#35302a;--accent:#d9a273;--accent2:#c99562;--chip:#2a2622;--sh:0 8px 26px -12px #000;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171513;--card:#211e1b;--ink:#efe7db;--mute:#9a9082;--line:#35302a;--accent:#d9a273;--accent2:#c99562;--chip:#2a2622;--sh:0 8px 26px -12px #000;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-weight:300;letter-spacing:.04em;line-height:1.9}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.serif,h1,h2,h3,.logo{font-family:"Noto Serif TC","Songti TC","PMingLiU",serif}
svg.i{width:1.4em;height:1.4em;flex:none}
header{position:sticky;top:env(safe-area-inset-top,0px);background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);z-index:9}
.bar{max-width:1180px;margin:0 auto;padding:0 22px;height:68px;display:flex;align-items:center;gap:36px}
.logo{display:flex;align-items:center;gap:10px;font-size:1.2rem;letter-spacing:.12em;color:var(--ink);white-space:nowrap}
.logo svg{width:34px;height:34px;color:var(--accent)}
nav{display:flex;gap:6px;flex:1;height:100%}
nav button{font:inherit;font-size:.92rem;letter-spacing:.14em;background:none;border:0;border-bottom:2px solid transparent;padding:0 14px;color:var(--ink);cursor:pointer;height:100%}
nav button.on{color:var(--accent);border-bottom-color:var(--accent2)}
.ib{background:none;border:0;color:var(--ink);cursor:pointer;padding:6px;display:flex}
.w{max-width:1180px;margin:0 auto;padding:0 22px 60px}
.hero{position:relative;min-height:520px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;padding:40px 20px;overflow:hidden}
.hero>svg{position:absolute;inset:0;width:100%;height:100%}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(30,18,8,.34),rgba(30,18,8,.46));z-index:1}
.hero>*:not(svg){position:relative;z-index:2}
.hero h1{font-weight:600;font-size:clamp(2rem,5.5vw,3.4rem);letter-spacing:.2em;margin:0;text-shadow:0 2px 18px rgba(0,0,0,.35)}
.hero p{font-family:"Noto Serif TC",serif;font-size:1.05rem;letter-spacing:.15em;margin:14px 0 30px;text-shadow:0 1px 10px rgba(0,0,0,.4)}
.pill{display:flex;align-items:center;gap:10px;background:rgba(255,253,248,.94);color:#3b3028;border-radius:99px;padding:6px 8px 6px 20px;width:100%;max-width:580px;box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}
.pill input{flex:1;min-width:0;border:0;background:none;font:inherit;color:#3b3028;padding:8px 0;margin:0;outline:none}
.pill button{border:0;background:#ece4d6;color:#3b3028;border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.pill.big{margin:36px auto 10px;background:var(--card);box-shadow:var(--sh)}
.pill.big,.pill.big input{color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px;margin:30px 0 10px}
.stat{display:flex;align-items:center;gap:18px;background:var(--card);border:0;border-radius:14px;padding:18px 22px;box-shadow:var(--sh);font:inherit;color:var(--ink);text-align:left;cursor:pointer;transition:transform .2s}
.stat:hover{transform:translateY(-3px)}
.stat svg.i{width:34px;height:34px;color:var(--accent)}
.stat div{flex:1}.stat b{display:block;font-family:"Noto Serif TC",serif;font-weight:400;letter-spacing:.12em}.stat small{color:var(--mute)}
.stat .ar{width:20px;height:20px;color:var(--mute)}
h2{font-weight:300;font-size:1.2rem;letter-spacing:.4em;text-align:center;margin:62px 0 26px}
h2::after{content:"";display:block;width:26px;height:1px;background:var(--accent2);margin:12px auto 0}
.about{max-width:640px;margin:50px auto 0;text-align:center;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:30px 22px}
.book{background:none;border:0;padding:0;text-align:left;font:inherit;color:inherit;cursor:pointer}
.cover{aspect-ratio:2/3;border-radius:3px 7px 7px 3px;display:flex;flex-direction:column;justify-content:space-between;padding:12px 10px;color:#fff;font-family:"Noto Serif TC",serif;font-weight:400;letter-spacing:.12em;box-shadow:inset 4px 0 0 rgba(0,0,0,.18),0 14px 26px -14px rgba(0,0,0,.5);filter:saturate(.55) brightness(1.05);overflow:hidden;transition:transform .25s}
.cover span{font-size:.7rem;font-weight:300;opacity:.85}
.cover img{width:100%;height:100%;object-fit:cover;margin:-12px -10px}
.book:hover .cover{transform:translateY(-4px)}
.book h3{font-weight:400;font-size:.95rem;margin:12px 0 0;line-height:1.5}
.book small{color:var(--mute);display:block}
.tag{display:inline-block;font-size:.72rem;padding:0 10px;border-radius:99px;border:1px solid var(--line);color:var(--mute);letter-spacing:.12em}
.tag.read{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.tag.ing{background:var(--accent2);border-color:var(--accent2);color:#fff}
.star{color:var(--accent2)}
.new{position:relative}.new::after{content:"NEW";position:absolute;top:8px;right:6px;background:var(--accent2);color:#fff;font:500 .62rem sans-serif;letter-spacing:.12em;padding:1px 7px;border-radius:99px}
.filters{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 2px;margin:30px 0 18px}
.row{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin:4px 0}
.row>b{min-width:3.4em;color:var(--mute);font-weight:400;font-size:.88rem}
.chip{font:inherit;font-size:.86rem;border:0;border-bottom:1px solid transparent;background:none;color:var(--mute);padding:0 9px;letter-spacing:.1em;cursor:pointer}
.chip.on{color:var(--accent);border-bottom-color:var(--accent2)}
.modal{position:fixed;inset:0;background:rgba(30,20,10,.55);display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}
.sheet{background:var(--card);border-radius:16px;max-width:660px;width:100%;max-height:86vh;overflow:auto;padding:24px;display:grid;grid-template-columns:160px 1fr;gap:22px}
.sheet h3{margin:0 0 4px;font-size:1.3rem;font-weight:600}
.sheet dl{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;margin:10px 0;font-size:.92rem}
.sheet dt{color:var(--mute)}.sheet dd{margin:0}
.rev{grid-column:1/-1;background:var(--chip);border-radius:12px;padding:12px 16px;margin:0}
.x{grid-column:1/-1;justify-self:end;font:inherit;border:1px solid var(--line);background:none;color:var(--ink);border-radius:99px;padding:2px 18px;cursor:pointer}
@media(max-width:600px){.sheet{grid-template-columns:1fr}.sheet .cover{max-width:140px}.bar{gap:10px;padding:0 12px}.logo span{display:none}nav button{padding:0 8px}}
textarea,input.f{width:100%;font:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 14px;margin:4px 0 10px}
.btn{font:inherit;background:var(--accent);color:#fff;border:0;border-radius:99px;padding:6px 26px;letter-spacing:.2em;cursor:pointer}
.q{border-bottom:1px solid var(--line);padding:16px 0}
.q .a{border-left:2px solid var(--accent2);padding-left:12px;margin-top:8px}
.q small,.note{color:var(--mute);font-size:.88rem}
.hit{display:flex;gap:16px;width:100%;padding:16px 0;border-bottom:1px solid var(--line)}
.hit .sw{width:4px;flex:none}.hit h3{margin:0}
mark{background:color-mix(in srgb,var(--accent2) 35%,transparent);color:inherit}
@media(max-width:600px){nav{overflow-x:auto;scrollbar-width:none}nav button{white-space:nowrap}}
.ab{max-width:680px}.ab h3{margin:34px 0 6px;letter-spacing:.3em;font-weight:400}.ab p{margin:12px 0}
.links{display:grid;gap:12px;margin-top:16px}
.lk{display:flex;align-items:center;gap:16px;background:var(--card);border-radius:14px;padding:16px 22px;box-shadow:var(--sh);color:var(--ink);text-decoration:none}
.lk b{display:block;font-family:"Noto Serif TC",serif;font-weight:400;letter-spacing:.12em}.lk small{color:var(--mute);word-break:break-all}
.lk svg.i{width:30px;height:30px;color:var(--accent)}.lk svg.ar{margin-left:auto;width:20px;height:20px;color:var(--mute)}
.bp{display:grid;grid-template-columns:minmax(150px,260px) 1fr;gap:36px;margin-top:10px}
.bp dl{display:grid;grid-template-columns:auto 1fr;gap:4px 18px;margin:16px 0}
.bp dt{color:var(--mute)}.bp dd{margin:0}
@media(max-width:600px){.bp{grid-template-columns:1fr}.bp .cover{max-width:200px}}
footer{text-align:center;color:var(--mute);font-size:.85rem;letter-spacing:.25em;padding:40px 20px}
</style>
</head>

function heroArt(){
  if(HERO_IMG)return `<svg viewBox="0 0 10 10" preserveAspectRatio="xMidYMid slice"><image href="${HERO_IMG}" width="10" height="10" preserveAspectRatio="xMidYMid slice"/></svg>`;
  const cols=["#d9cdb8","#2f5d57","#a43c35","#e8e0cf","#264653","#c9b48a","#6b4a30","#3d5a4a","#efe6d6","#8c5a3c"];
  let sh="";const row=(base,x0)=>{let x=x0;for(let i=0;x<1620;i++){const w=22+(i*7)%18,h=90+(i*37+base)%70;sh+=`<rect x="${x}" y="${base-h}" width="${w}" height="${h}" fill="${cols[(i+base)%10]}"/>`;x+=w+3}};
  row(190,1040);row(400,1010);
  return `<svg viewBox="0 0 1600 700" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs>
  <linearGradient id="wl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6ecda"/><stop offset="1" stop-color="#cdab80"/></linearGradient>
  <linearGradient id="tb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d79e5f"/><stop offset="1" stop-color="#94602f"/></linearGradient>
  <filter id="bl"><feGaussianBlur stdDeviation="4"/></filter></defs>
  <rect width="1600" height="700" fill="url(#wl)"/>
  <rect x="1000" width="600" height="700" fill="#7a5336" opacity=".55"/>
  <g filter="url(#bl)" opacity=".9">${sh}<rect x="1000" y="190" width="600" height="8" fill="#5a3a22"/><rect x="1000" y="400" width="600" height="8" fill="#5a3a22"/></g>
  <polygon points="320,0 760,0 560,540 120,540" fill="#fff" opacity=".2"/>
  <rect y="530" width="1600" height="170" fill="url(#tb)"/>
  <g><rect x="190" y="494" width="330" height="36" rx="2" fill="#efe9dc"/><rect x="180" y="458" width="340" height="36" rx="2" fill="#31493e"/><rect x="195" y="422" width="325" height="36" rx="2" fill="#f0e9da"/><rect x="200" y="386" width="320" height="36" rx="2" fill="#e9e3d3"/></g>
  <g><rect x="660" y="440" width="120" height="90" rx="22" fill="#bfb3a2"/><ellipse cx="720" cy="440" rx="60" ry="12" fill="#a99d8c"/><ellipse cx="720" cy="540" rx="80" ry="12" fill="#6b4630"/></g>
  <g fill="#5b8c55"><ellipse cx="70" cy="300" rx="22" ry="55" transform="rotate(-25 70 300)"/><ellipse cx="130" cy="260" rx="22" ry="60" transform="rotate(10 130 260)"/><ellipse cx="40" cy="380" rx="20" ry="50" transform="rotate(-60 40 380)"/><ellipse cx="160" cy="350" rx="20" ry="52" transform="rotate(50 160 350)"/></g>
  <rect x="20" y="420" width="150" height="110" rx="28" fill="#d8d2c6"/></svg>`;
}
function cover(b){
  const h=hue(b.title);
  const inner=b.cover?`<img src="${esc(b.cover)}" alt="${esc(b.title)}封面">`:`<div>${esc(b.title)}</div><span>${esc(b.author)}</span>`;
  return `<div class="cover" style="background:linear-gradient(160deg,hsl(${h} 45% 38%),hsl(${(h+40)%360} 50% 24%))">${inner}</div>`;
}
const tagCls=s=>s==="已讀"?"read":s==="閱讀中"?"ing":"";
function card(b,isNew){
  return `<button class="book ${isNew?"new":""}" data-id="${b.id}">${cover(b)}<h3>${esc(b.title)}</h3><small>${esc(b.author)}</small>
  <span class="tag ${tagCls(b.status)}">${esc(b.status)}</span> ${b.rating?`<span class="star">${"★".repeat(b.rating)}</span>`:""}</button>`;
}
function home(){
  const n=f=>BOOKS.filter(f).length;
  const S=[["book","全部藏書",BOOKS.length,"all"],["mark","尚未閱讀",n(b=>b.status==="未讀"),"status=未讀"],["book","閱讀中",n(b=>b.status==="閱讀中"),"status=閱讀中"],["heart","最愛收藏",n(b=>b.rating===5),"rate=5"]];
  const picks=BOOKS.filter(b=>b.rating>=4),fresh=[...BOOKS].sort((a,b)=>(b.added||"").localeCompare(a.added||"")||b.id-a.id).slice(0,4);
  app.innerHTML=`<section class="hero"${HERO_IMG?` style="background:url('${HERO_IMG}') center/cover no-repeat"`:""}>${HERO_IMG?"":heroArt()}<h1>我的藏書室</h1><p>收藏每一本書，也記錄每一次閱讀。</p>
  <div class="pill">${ic("search")}<input id="hq" placeholder="搜尋書名、作者、出版者、心得…" aria-label="搜尋"><button id="hgo" aria-label="搜尋">${ic("arrow")}</button></div></section>
  <div class="w"><div class="stats">${S.map(s=>`<button class="stat" data-f="${s[3]}">${ic(s[0])}<div><b>${s[1]}</b><small>共 ${s[2]} 本</small></div>${ic("arrow","ar")}</button>`).join("")}</div>
  <div class="about"><p>這裡是我個人的閱讀角落，記錄每一本買下、讀過或等待翻開的書，包含出版資訊、閱讀狀態、評分與一點心得。歡迎隨意翻閱，也可到「訪客提問」留下你的問題或推薦。</p></div>
  <h2>推薦書籍</h2><div class="grid">${picks.map(b=>card(b)).join("")}</div>
  <h2>新書上架</h2><div class="grid">${fresh.map(b=>card(b,true)).join("")}</div>
  <h2>從主題開始逛</h2><div class="row" style="justify-content:center">${THEMES.map(t=>`<button class="chip" data-theme="${esc(t)}">${esc(t)}</button>`).join("")}</div></div>`;
}
function chips(label,key,opts){
  return `<div class="row"><b>${label}</b>${opts.map(([v,t])=>`<button class="chip ${F[key]===v?"on":""}" data-k="${key}" data-v="${esc(v)}">${esc(t)}</button>`).join("")}</div>`;
}
function index(){
  const all=v=>[["全部","全部"]].concat(v.map(x=>[x,x]));
  const list=BOOKS.filter(b=>(F.theme==="全部"||b.theme===F.theme)&&(F.era==="全部"||era(b.year)===F.era)&&rateOk(b,F.rate)&&(F.status==="全部"||b.status===F.status));
  app.innerHTML=`<div class="w"><h2>分類索引</h2><div class="filters">${chips("主題","theme",all(THEMES))}${chips("年代","era",all(ERAS))}${chips("評分","rate",RATES)}${chips("狀態","status",all(["已讀","閱讀中","未讀"]))}</div>
  <p class="note">共 ${list.length} 本符合條件${list.length?"，點選書籍可查看完整資料與心得。":""}</p>
  ${list.length?`<div class="grid">${list.map(b=>card(b)).join("")}</div>`:`<p>沒有符合的書，試著放寬條件吧。</p>`}</div>`;
}
function openBook(id){
  const b=BOOKS.find(x=>x.id==id);if(!b)return;
  document.getElementById("modal").innerHTML=`<div class="modal" id="mo"><div class="sheet" role="dialog" aria-label="${esc(b.title)}">
  ${cover(b)}<div><h3>${esc(b.title)}</h3><div>${esc(b.author)}</div>
  <dl><dt>出版年</dt><dd>${b.year}</dd><dt>出版地</dt><dd>${esc(b.place)}</dd><dt>出版者</dt><dd>${esc(b.publisher)}</dd><dt>主題</dt><dd>${esc(b.theme)}${b.sub?" · "+esc(b.sub):""}</dd><dt>狀態</dt><dd>${esc(b.status)}</dd><dt>評分</dt><dd>${stars(b.rating)}</dd></dl></div>
  <p class="rev"><b>心得：</b>${b.review?esc(b.review):"尚未寫下心得。"}</p><button class="x" id="cl">關閉</button></div></div>`;
}
// ===== 全站搜尋 =====
function openSearch(q){
  cur="search";document.querySelectorAll("nav button").forEach(b=>b.classList.remove("on"));
  app.innerHTML=`<div class="w"><div class="pill big">${ic("search")}<input id="gs" value="${esc(q)}" placeholder="搜尋書名、作者、出版者、心得…" aria-label="全站搜尋"></div><div id="sr"></div></div>`;
  document.getElementById("gs").focus();results(q);window.scrollTo(0,0);
}
function results(q){
  q=q.trim();const el=document.getElementById("sr");if(!el)return;
  if(!q){el.innerHTML='<p class="note" style="text-align:center">輸入關鍵字，搜尋整個藏書室。</p>';return}
  const k=q.toLowerCase(),re=new RegExp(esc(q).replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi");
  const hl=s=>esc(s).replace(re,m=>"<mark>"+m+"</mark>");
  const bs=BOOKS.filter(b=>[b.title,b.author,b.publisher,b.place,b.theme,b.status,b.year,b.review,b.sub,era(b.year)].join("\n").toLowerCase().includes(k));
  const qs=QS.filter(x=>[x.name,x.text,x.answer].join("\n").toLowerCase().includes(k));
  const snip=b=>{if(!b.review)return b.sub||"";const i=b.review.toLowerCase().indexOf(k);return i<0?b.review.slice(0,50)+"…":(i>20?"…":"")+b.review.slice(Math.max(0,i-20),i+40)+"…"};
  el.innerHTML=`<p class="note" style="text-align:center">找到 ${bs.length} 本書</p>
  ${bs.map(b=>`<button class="book hit" data-id="${b.id}"><i class="sw" style="background:hsl(${hue(b.title)} 35% 45%)"></i><div><h3>${hl(b.title)}</h3><small>${hl(b.author)} · ${hl(b.year)} · ${hl(b.publisher)}</small><div class="note">${hl(snip(b))}</div><span class="tag">${hl(b.theme)}</span> <span class="tag ${tagCls(b.status)}">${hl(b.status)}</span></div></button>`).join("")}
  ${qs.length?`<h2>相關提問</h2>`+qs.map(x=>`<div class="q"><b>${hl(x.name||"匿名訪客")}</b><div>${hl(x.text)}</div>${x.answer?`<div class="a">${hl(x.answer)}</div>`:""}</div>`).join(""):""}
  ${bs.length||qs.length?"":'<p class="note" style="text-align:center">沒有找到相符的內容，換個關鍵字試試吧。</p>'}`;
}
// ===== 訪客提問（嵌入 Google 表單） =====
const QS=[];
// 在引號內貼上 Google 表單的嵌入網址（結尾為 /viewform?embedded=true）；留空則顯示「即將開放」
const FORM_URL="https://docs.google.com/forms/d/e/1FAIpQLSfby1Nk1BUN6xxZWosyaT4L88a8WBhfb49EtR5OAZi1Nf9aSw/viewform?embedded=true";
function ask(){
  app.innerHTML=`<div class="w"><h2>訪客提問</h2><div class="filters"><p class="note" style="margin-top:0">對這裡的書、閱讀心得，或想請我推薦的書有任何問題，都歡迎留言。</p></div>${FORM_URL?`<p style="text-align:center"><a class="btn" style="display:inline-block;text-decoration:none" href="${esc(FORM_URL.replace("?embedded=true",""))}" target="_blank" rel="noopener">開啟提問表單</a></p><iframe src="${esc(FORM_URL)}" title="訪客提問表單" style="width:100%;height:760px;border:0">載入中…</iframe>`:'<p class="note" style="text-align:center">提問功能即將開放，敬請期待。</p>'}</div>`;
}
// ===== 關於藏書室 =====
function about(){
  const L=[["ig","Instagram","@w911119","https://www.instagram.com/w911119/"],["at","Threads","@w911119","https://www.threads.com/@w911119"],["mail","電子郵件","wendy911119@gmail.com","mailto:wendy911119@gmail.com"]];
  app.innerHTML=`<div class="w ab"><h2>關於藏書室</h2>
  <h3 class="serif">為什麼成立這個網頁</h3>
  <p>讀過的書，常常讀完就收進書架，心得與感受也跟著淡去。我想為自己的閱讀留下一點痕跡，所以建立了這個藏書室，記錄每一本書的出版資訊、閱讀狀態、評分與心得。</p>

  <h3 class="serif">聯絡與追蹤</h3>
  <div class="links">${L.map(l=>`<a class="lk" href="${l[3]}" target="_blank" rel="noopener">${ic(l[0])}<div><b>${l[1]}</b><small>${l[2]}</small></div>${ic("arrow","ar")}</a>`).join("")}</div></div>`;
}
// ===== 書籍單頁 =====
let backTo="",lastQ="",sup=0;
function bookPage(id){
  const b=BOOKS.find(x=>x.id==id);if(!b){show("home");return}
  cur="book";document.querySelectorAll("nav button").forEach(x=>x.classList.remove("on"));
  const rel=BOOKS.filter(x=>x.id!==b.id&&x.theme===b.theme).slice(0,4);
  document.title=b.title+"｜我的藏書室";
  app.innerHTML=`<div class="w"><p><button class="chip" data-back="1">← 返回</button></p>
  <article class="bp">${cover(b)}<div><h1 class="serif" style="font-weight:600;letter-spacing:.1em;margin:0 0 6px">${esc(b.title)}</h1><div>${esc(b.author)}</div>
  <dl><dt>出版年</dt><dd>${b.year}</dd><dt>出版地</dt><dd>${esc(b.place)}</dd><dt>出版者</dt><dd>${esc(b.publisher)}</dd><dt>主題</dt><dd>${esc(b.theme)}${b.sub?" · "+esc(b.sub):""}</dd><dt>閱讀狀態</dt><dd><span class="tag ${tagCls(b.status)}">${esc(b.status)}</span></dd><dt>評分</dt><dd>${stars(b.rating)}</dd></dl>
  <h3 class="serif" style="margin:26px 0 6px;letter-spacing:.3em;font-weight:400">心得</h3><p>${b.review?esc(b.review):"尚未寫下心得。"}</p></div></article>
  ${rel.length?`<h2>同主題的書</h2><div class="grid">${rel.map(x=>card(x)).join("")}</div>`:""}</div>`;
  window.scrollTo(0,0);
}
function goBook(id){
  backTo=cur==="book"?backTo:cur;
  if(cur==="search"){const g=document.getElementById("gs");if(g)lastQ=g.value}
  bookPage(id);
  try{if(location.hash!=="#book-"+id){sup=1;location.hash="book-"+id}}catch(e){sup=0}
}
function leave(){document.title="我的藏書室";if(backTo==="search")openSearch(lastQ);else show(backTo||"home")}
function backBtn(){try{if(backTo&&location.hash){history.back();return}}catch(e){}leave()}
window.addEventListener("hashchange",()=>{
  if(sup){sup=0;return}
  const m=location.hash.match(/^#book-(\d+)$/);
  if(m)bookPage(m[1]);else if(cur==="book")leave();
});
// ===== 路由與事件 =====
function show(p){cur=p;try{if(location.hash)history.replaceState(null,"",location.pathname+location.search)}catch(e){}document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.p===p));({home,index,ask,about})[p]();window.scrollTo(0,0)}
document.addEventListener("click",async e=>{
  const t=e.target,c=s=>t.closest(s);
  if(c("nav button")){show(c("nav button").dataset.p);return}
  if(c("#hs")){openSearch("");return}
  if(c("#hgo")){openSearch(document.getElementById("hq").value);return}
  if(t.id==="cl"||t.id==="mo"){document.getElementById("modal").innerHTML="";return}
  if(c("[data-back]")){backBtn();return}
  if(c(".book")){goBook(c(".book").dataset.id);return}
  if(c(".stat")){F={theme:"全部",era:"全部",rate:"全部",status:"全部"};const f=c(".stat").dataset.f;if(f!=="all"){const[k,v]=f.split("=");F[k]=v}show("index");return}
  if(t.dataset.theme){F={theme:t.dataset.theme,era:"全部",rate:"全部",status:"全部"};show("index");return}
  if(t.dataset.k){F[t.dataset.k]=t.dataset.v;index();return}
  if(t.id==="qs"){submitQ();return}
  if(t.dataset.save&&db){
    const v=document.querySelector(`[data-ans="${CSS.escape(t.dataset.save)}"]`).value.trim();
    try{await db.collection("questions").doc(t.dataset.save).update({answer:v})}catch(err){t.textContent="儲存失敗"}
  }
});
document.addEventListener("input",e=>{if(e.target.id==="gs")results(e.target.value)});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape")document.getElementById("modal").innerHTML="";
  if(e.key==="Enter"&&e.target.id==="hq")openSearch(e.target.value);
});
{const m0=location.hash.match(/^#book-(\d+)$/);if(m0)bookPage(m0[1]);else show("home");}
</script>
